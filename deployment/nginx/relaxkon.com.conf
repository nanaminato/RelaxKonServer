# One Nginx virtual host fronts both the Angular build and RelaxKonServer.
# Bind the same certificate (or a SAN/wildcard certificate) to every listed name.
server {
    listen 80;
    listen [::]:80;
    server_name relaxkon.com www.relaxkon.com downloads.relaxkon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relaxkon.com www.relaxkon.com downloads.relaxkon.com;

    # Set these two paths for the deployed certificate files.
    ssl_certificate     /etc/letsencrypt/live/relaxkon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relaxkon.com/privkey.pem;

    root /srv/relaxkon/frontend/browser;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5062;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Release descriptors, installers, checksums and ZIPs come from the existing API.
    location /relaxkonos/ {
        proxy_pass http://127.0.0.1:5062;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
