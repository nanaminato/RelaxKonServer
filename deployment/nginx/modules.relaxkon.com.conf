server {
    listen 80;
    listen [::]:80;
    server_name modules.relaxkon.com;
    return 301 https://modules.relaxkon.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modules.relaxkon.com;

    ssl_certificate     /etc/letsencrypt/live/modules.relaxkon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modules.relaxkon.com/privkey.pem;

    root /srv/relaxkon/modules;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    location = /stable/catalog.json {
        types { application/json json; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Publisher signs archive URLs at the origin root.
    location ~ ^/[a-z0-9][a-z0-9.-]*\.rkmodule$ {
        types { application/octet-stream rkmodule; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
